apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0-plus-alpine@sha256:c1de5d357a4826089fc3fb597e9f5e3595e65b434746dc5176336078f8c2cdc8

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data

          securityContext:
            allowPrivilegeEscalation: false

          envFrom:
            - secretRef:
                name: linkding-dotenv
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
