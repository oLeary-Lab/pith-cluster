apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes:
    - Egress
  egress:
    # DNS through CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Traefik, which forwards the tunnel's published hostnames. The port is
    # omitted on purpose: the Traefik Service maps port 80 to the pod's `web`
    # entrypoint, and NetworkPolicy matches the post-DNAT pod port, so naming a
    # port here would be a guess that breaks the tunnel if wrong.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # The Cloudflare edge. QUIC is UDP/7844; TCP/443 is the HTTP/2 fallback.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 7844
