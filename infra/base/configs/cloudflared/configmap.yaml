apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflare
data:
  config.yaml: |
    tunnel: linkding-pith

    credentials-file: /etc/cloudflared/creds/credentials.json

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000

    # Autoupdates applied in a k8s pod will be lost when the pod is removed or restarted, so
    # autoupdate doesn't make sense in Kubernetes. However, outside of Kubernetes, we strongly
    # recommend using autoupdate.
    no-autoupdate: true

    # Each published hostname forwards to the ingress controller, which routes by
    # Host to the right Service. Adding an app means adding an Ingress and a
    # hostname here. To avoid editing this file per app, delete the hostname
    # rules below and leave a single catch-all that also points at Traefik.
    ingress:
    - hostname: linkding.olearylab.com
      service: http://traefik.traefik.svc.cluster.local:80

    - hostname: grafana.olearylab.com
      service: http://traefik.traefik.svc.cluster.local:80

    # This rule matches any traffic which didn't match a previous rule, and responds with HTTP 404.
    - service: http_status:404
