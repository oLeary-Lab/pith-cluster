apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-token-script
data:
  # Run as an init container. Mints a short-lived GitHub App installation token
  # and writes it as a Renovate config file; the Renovate container reads that
  # file via RENOVATE_CONFIG_FILE. The App private key never reaches the Renovate
  # container.
  mint-token.mjs: |
    import { readFileSync, writeFileSync } from 'node:fs';
    import { createSign } from 'node:crypto';

    const appId = process.env.GITHUB_APP_ID;
    const installationId = process.env.GITHUB_APP_INSTALLATION_ID;
    const keyPath = process.env.GITHUB_APP_KEY_PATH;
    const outPath = process.env.RENOVATE_CONFIG_FILE || '/run/renovate/config.json';

    if (!appId || !installationId || !keyPath) {
      throw new Error(
        'GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID and GITHUB_APP_KEY_PATH are required',
      );
    }

    const now = Math.floor(Date.now() / 1000);
    const b64url = (input) => Buffer.from(input).toString('base64url');
    const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
    // iat is backdated 60s for clock skew; exp stays within GitHub's 10-minute cap.
    const payload = b64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: appId }));

    const signer = createSign('RSA-SHA256');
    signer.update(`${header}.${payload}`);
    const jwt = `${header}.${payload}.${signer.sign(readFileSync(keyPath)).toString('base64url')}`;

    const response = await fetch(
      `https://api.github.com/app/installations/${installationId}/access_tokens`,
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${jwt}`,
          Accept: 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
      },
    );

    if (!response.ok) {
      throw new Error(`GitHub token exchange failed: ${response.status} ${await response.text()}`);
    }

    const { token, expires_at: expiresAt } = await response.json();
    writeFileSync(outPath, `${JSON.stringify({ token })}\n`, { mode: 0o600 });
    console.log(`Minted GitHub App installation token, expires at ${expiresAt}`);
