apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  # Runs daily at 00:00 UTC (explicit so the intent survives a cluster TZ change).
  schedule: "@daily"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          # The egress NetworkPolicy selects this label.
          labels:
            app: renovate
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: mint-token
              image: renovate/renovate:44.181.4@sha256:e2440463a0fff07e43875643324f8b57f6c3a9a8365332b7183989514f81e9ee
              command:
                - node
                - /scripts/mint-token.mjs
              env:
                - name: GITHUB_APP_KEY_PATH
                  value: /etc/renovate/app/private-key.pem
              envFrom:
                - configMapRef:
                    name: renovate-configmap
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: app-key
                  mountPath: /etc/renovate/app
                  readOnly: true
                - name: app-token
                  mountPath: /run/renovate
          containers:
            - name: renovate
              image: renovate/renovate:44.181.4@sha256:e2440463a0fff07e43875643324f8b57f6c3a9a8365332b7183989514f81e9ee
              args:
                - oLeary-Lab/pith-cluster
              envFrom:
                - configMapRef:
                    name: renovate-configmap
              env:
                # Renovate reads its installation token from the config file the
                # init container writes.
                - name: RENOVATE_CONFIG_FILE
                  value: /run/renovate/config.json
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: cache
                  mountPath: /tmp/renovate
                - name: app-token
                  mountPath: /run/renovate
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 256Mi
            - name: app-token
              emptyDir:
                # Memory-backed: the volume exists only to hold the minted token
                # fleetingly, so it must not touch node-local disk.
                medium: Memory
                sizeLimit: 8Mi
            - name: script
              configMap:
                name: renovate-token-script
            - name: app-key
              secret:
                secretName: renovate-app-key
