apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  # Runs daily at 00:00 UTC (explicit so the intent survives a cluster TZ change).
  schedule: "@daily"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: renovate/renovate:44.181.4@sha256:e2440463a0fff07e43875643324f8b57f6c3a9a8365332b7183989514f81e9ee
              args:
                - oLeary-Lab/pith-cluster
              envFrom:
                - configMapRef:
                    name: renovate-configmap
                - secretRef:
                    name: renovate-dotenv
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: cache
                  mountPath: /tmp/renovate
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 256Mi
