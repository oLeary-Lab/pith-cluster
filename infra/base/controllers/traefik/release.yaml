apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: 42.1.3
  interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    service:
      spec:
        type: ClusterIP
    ingressClass:
      enabled: true
      name: traefik
      isDefaultClass: true
    providers:
      kubernetesIngress:
        enabled: true
    ports:
      web:
        # Trust X-Forwarded-* only from cluster pods (cloudflared), so access
        # logs and metrics record the client IP rather than the pod IP.
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
    # The only way to see routing decisions until a log pipeline exists.
    accessLog:
      enabled: true
    metrics:
      prometheus:
        # infra and monitoring reconcile independently, so the chart must not
        # abort rendering when the ServiceMonitor CRD is not yet discoverable.
        disableAPICheck: true
        serviceMonitor:
          enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
